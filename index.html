<body>
<style>
@font-face{font-family:'Pretty On The Inside';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/PrettyOnTheInside.woff2') format('woff2');}
@font-face{font-family:'Stars';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/Stars.woff2') format('woff2');}
@font-face{font-family:'HSYeoleum';font-style:normal;font-weight:400;font-display:swap;src:url('assets/fonts/HSYeoleum.woff2') format('woff2');}
:root{
  color-scheme:dark;
  --bg:#000000;
  --paper:#FFFFFF;
  --ink:#111111;
  --text:#FFFFFF;
  --text-2:#999999;
  --text-3:#666666;
  --mint:#00C8B3;
  --blue:#0088FF;
  --rule:#333333;
  --rule-faint:#222222;
  --stars:'Stars','Inter','Helvetica Neue',Arial,sans-serif;
  --wordmark:'Pretty On The Inside','Stars','Inter',cursive,sans-serif;
  --kr:'HSYeoleum','HS여름물빛체 2.0','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --sans:'Inter','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
button{font:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:6px}
.skip{position:fixed;top:-100px;left:24px;z-index:300;background:#fff;color:#000;padding:12px}
.skip:focus{top:12px}

/* ---------- star field ---------- */
.stars-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.stars-bg svg{position:absolute;opacity:.85}

/* ---------- header ---------- */
header{position:relative;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:56px 64px 0}
.wordmark{font-family:var(--wordmark);font-size:clamp(38px,5.6vw,80px);line-height:1.12;letter-spacing:.1em;white-space:nowrap}
.nav-link{font-family:var(--stars);font-size:clamp(15px,1.7vw,24px);line-height:1.5;padding-top:8px;white-space:nowrap}

/* ---------- shell ---------- */
main{position:relative;z-index:10;max-width:1440px;margin:0 auto;padding:0 88px 40px}
.wrap{position:relative}

/* ---------- list intro ---------- */
.intro{position:relative;padding-top:56px}
.eyebrow{font-family:var(--stars);font-size:clamp(20px,2.3vw,32px);letter-spacing:.2em;line-height:1.4;margin:0}
h1.title{font-family:var(--stars);font-size:clamp(44px,6.6vw,94px);letter-spacing:-.065em;line-height:1.06;margin:18px 0 26px;text-wrap:balance}
.copy{font-family:var(--kr);font-size:clamp(15px,1.3vw,17px);line-height:1.8;color:var(--mint);margin:0;max-width:340px}
.count{font-family:var(--stars);font-size:clamp(14px,1.45vw,20px);letter-spacing:.06em;color:var(--text);display:block;text-align:right;margin-top:-28px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 48px;padding:64px 8px 0}
.card{position:relative;display:block;align-self:start;cursor:pointer;
  transform:translateY(var(--off));
  transition:transform 320ms cubic-bezier(.2,.7,.3,1),opacity 240ms}

/* painted cream frame with hand-cut stars */
.frame{position:relative;display:block;overflow:hidden;
  background:#EFE8D8;padding:5.5%;
  box-shadow:0 14px 36px rgba(0,0,0,.6);
  transform:rotate(var(--rot));
  transition:transform 320ms cubic-bezier(.2,.7,.3,1),box-shadow 320ms}
.paint{position:absolute;inset:0;z-index:0;pointer-events:none}
.paint svg{position:absolute;fill:#3D2B1E;aspect-ratio:1;height:auto}
.card img{position:relative;z-index:1;aspect-ratio:2/3;object-fit:cover;width:100%;display:block;
  box-shadow:0 0 0 1px rgba(61,43,30,.18)}

.cap{display:block;margin-top:14px;
  font-family:var(--kr);font-size:14px;letter-spacing:.01em;color:var(--text)}

.card:focus-visible .frame{transform:rotate(0deg) scale(1.05);box-shadow:0 26px 62px rgba(0,0,0,.85)}
.grid:has(.card:focus-visible) .card:not(:focus-visible){opacity:.45}
@media(hover:hover){
  .card:hover .frame{transform:rotate(0deg) scale(1.05);box-shadow:0 26px 62px rgba(0,0,0,.85)}
  .grid:has(.card:hover) .card:not(:hover){opacity:.45}
}

.grid-end{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin:56px 0 0;flex-wrap:wrap}
.grid-end .note{font-family:var(--kr);font-size:16px;letter-spacing:.02em;color:var(--mint)}
.grid-end a{font-family:var(--stars);font-size:clamp(15px,1.7vw,24px)}

/* ---------- star divider ---------- */
.divider{font-family:var(--stars);font-size:clamp(16px,2vw,28px);letter-spacing:.15em;line-height:3;color:var(--text);
  margin:96px 0 0;overflow:hidden;white-space:nowrap;user-select:none}

/* ---------- artists ---------- */
.artists{padding:8px 0 0}
.artists .eyebrow{font-size:clamp(17px,1.8vw,24px);letter-spacing:.2em}
.artists h2{font-family:var(--kr);font-size:clamp(22px,2.2vw,28px);letter-spacing:-.04em;line-height:1.3;margin:14px 0 18px}
.artists .note-kr{font-family:var(--kr);font-size:15px;line-height:1.8;color:var(--mint);margin:0}

/* ---------- footer ---------- */
footer{position:relative;z-index:10;max-width:1440px;margin:0 auto;padding:30px 88px 48px;border-top:1px solid var(--rule-faint);
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-family:var(--sans);font-size:11px;letter-spacing:.06em;color:var(--text-2);margin-top:64px}
footer .kr{font-family:var(--kr);font-size:13px;letter-spacing:0}

/* ---------- detail ---------- */
.hero{display:flex;justify-content:center;margin:24px 0 0}
.hero-wrap{position:relative;display:block;width:min(520px,100%)}
.hero img{width:100%;aspect-ratio:2/3;object-fit:cover}
.hero .ex{font-size:15px;padding:9px 17px;bottom:5%}
.detail-body{max-width:861px;margin:0 auto;padding-top:56px}
.detail .eyebrow{font-size:clamp(17px,1.8vw,24px);letter-spacing:.2em}
h1.work-title{font-family:var(--sans);font-weight:800;font-size:clamp(34px,4.6vw,64px);letter-spacing:-.05em;line-height:1.12;margin:22px 0 16px;text-wrap:balance}
.meta{font-family:var(--kr);font-size:13px;letter-spacing:.02em;color:var(--text-2);margin:0}
.desc{font-family:var(--kr);font-size:clamp(16px,1.5vw,20px);line-height:2;letter-spacing:.01em;color:var(--text-2);margin:28px 0 0;max-width:700px}
.desc mark{background:none;color:var(--blue)}
.product{display:grid;grid-template-columns:1fr 400px;gap:48px;align-items:start;margin:8px 0 0}
.spec{font-family:var(--kr);font-size:clamp(16px,1.5vw,20px);line-height:1.8;color:var(--text-2);margin:0}
.buy-col{display:flex;flex-direction:column;gap:10px}
.size{font-family:'Noto Sans KR',var(--sans);font-size:15px;line-height:1.8;color:var(--text);margin:0}
.price{font-family:var(--kr);font-size:clamp(22px,2.2vw,28px);letter-spacing:-.04em;line-height:1.3;margin:0}
.buy{display:block;width:100%;background:#FFFFFF;color:#000000;border:0;padding:14px;margin-top:12px;
  font-family:var(--kr);font-size:clamp(16px,1.5vw,20px);line-height:1.8;text-align:center;cursor:pointer;
  transition:background 180ms,color 180ms}
.buy:hover{background:var(--mint);color:#000}
/* 예시 도안 표시 — 흰 바탕 검은 글씨 */
.ex{position:absolute;z-index:2;left:50%;bottom:8%;transform:translateX(-50%);
  background:#FFFFFF;color:#000000;border:1px solid #000000;
  font-family:var(--kr);font-size:14px;line-height:1;letter-spacing:.02em;
  padding:8px 15px;white-space:nowrap;
  box-shadow:0 3px 14px rgba(0,0,0,.35)}

/* ---------- order modal ---------- */
.fd-modal{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px;
  background:rgba(0,0,0,.84);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  animation:fd-in 180ms ease-out}
.fd-modal[hidden]{display:none}
@keyframes fd-in{from{opacity:0}to{opacity:1}}
.fd-sheet{position:relative;width:min(470px,100%);max-height:90vh;overflow:auto;
  background:#0A0A0A;border:1px solid var(--rule);padding:40px 34px 30px}
.fd-x{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--text-3);
  font-size:26px;line-height:1;cursor:pointer;padding:6px}
.fd-x:hover{color:var(--text)}
.fd-eyebrow{font-family:var(--stars);font-size:17px;letter-spacing:.2em;margin:0 0 14px;color:var(--text)}
.fd-sheet h2{font-family:var(--kr);font-size:26px;letter-spacing:-.03em;line-height:1.35;margin:0 0 16px;font-weight:400}
.fd-lede{font-family:var(--kr);font-size:15px;line-height:1.9;color:var(--text-2);margin:0 0 22px}
.fd-lede strong{color:var(--mint);font-weight:400}
.fd-dim{font-size:14px;color:var(--text-3);border-top:1px solid var(--rule-faint);padding-top:18px}
.fd-dim strong{color:var(--blue)}
.fd-label{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--text-3);margin-bottom:8px}
.fd-input{width:100%;background:#000;border:1px solid var(--rule);color:var(--text);
  padding:13px 14px;font-family:var(--sans);font-size:15px}
.fd-input:focus{outline:none;border-color:var(--mint)}
.fd-err{font-family:var(--kr);font-size:13px;line-height:1.7;color:#FF6B6B;margin:9px 0 0}
.fd-err a{color:#FF6B6B;text-decoration:underline}
.fd-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fd-check{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;cursor:pointer}
.fd-check input{margin:3px 0 0;accent-color:var(--mint);flex:none}
.fd-check span{font-family:var(--kr);font-size:13px;line-height:1.7;color:var(--text-2)}
.fd-check em{display:block;font-style:normal;font-size:11.5px;line-height:1.7;color:var(--text-3);margin-top:5px}
.fd-submit{display:block;width:100%;margin-top:22px;background:var(--mint);color:#000;border:0;padding:14px;
  font-family:var(--kr);font-size:17px;cursor:pointer;transition:opacity 180ms}
.fd-submit:hover{opacity:.82}
.fd-submit:disabled{opacity:.5;cursor:wait}
.fd-ghost{background:none;color:var(--text-2);border:1px solid var(--rule)}
.fd-note{font-family:var(--kr);font-size:12px;color:var(--text-3);margin:16px 0 0;text-align:center}
@media(max-width:767px){.fd-sheet{padding:34px 22px 26px}.fd-sheet h2{font-size:22px}}
.work-nav{display:flex;justify-content:flex-end;margin:8px 0 0}
.work-nav a{text-align:right;font-family:var(--kr)}
.work-nav small{display:block;font-size:11px;letter-spacing:.06em;color:var(--text-2);margin-bottom:6px}
.work-nav strong{font-weight:400;font-size:14px}
.back{display:inline-block;font-family:var(--kr);font-size:15px;line-height:1.8;color:var(--text-2);margin:44px 0 0}

/* ---------- quantity ---------- */
.qty-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px;
  border-top:1px solid var(--rule-faint);padding-top:16px}
.qty-label{font-family:var(--kr);font-size:15px;color:var(--text-2)}
.qty{display:inline-flex;align-items:stretch;border:1px solid var(--rule)}
.qty button{width:44px;height:44px;background:none;border:0;color:var(--text);font-size:20px;line-height:1;cursor:pointer;
  transition:background 180ms,color 180ms}
.qty button:hover:not(:disabled){background:var(--mint);color:#000}
.qty button:disabled{color:var(--text-3);cursor:default}
.qty-n{min-width:52px;display:grid;place-items:center;font-family:var(--kr);font-size:18px;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:6px 0 0;
  font-family:var(--kr);font-size:15px;color:var(--text-2)}
.total strong{font-weight:400;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.04em;color:var(--mint);font-variant-numeric:tabular-nums}

/* ---------- wearing shots ---------- */
.wear{padding:8px 0 0}
.wear-h{font-family:var(--kr);font-weight:400;font-size:clamp(22px,2.2vw,28px);letter-spacing:-.04em;line-height:1.3;margin:14px 0 0}
.wear-list{display:flex;flex-direction:column;gap:20px;width:min(560px,100%);margin:36px auto 0}
.wear-list figure{margin:0}
.wear-list img{width:100%;height:auto}
.wear-note{font-family:var(--kr);font-size:13px;color:var(--text-3);text-align:center;margin:18px 0 0}

/* ---------- order summary ---------- */
.od-sum{margin:0 0 24px;border-top:1px solid var(--rule-faint)}
.od-sum div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule-faint)}
.od-sum dt{font-family:var(--kr);font-size:13px;color:var(--text-3);flex:none}
.od-sum dd{margin:0;font-family:var(--kr);font-size:15px;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.od-sum .od-total dd{font-size:22px;letter-spacing:-.03em;color:var(--mint)}
.od-bank{margin-bottom:0}
.od-bank .od-acct{font-family:var(--sans);font-size:17px;letter-spacing:.04em}
.od-gap{margin-top:16px}
.fd-step .fd-dim{margin-top:22px;margin-bottom:0}
.fd-ghost:hover{opacity:1;color:var(--text);border-color:var(--text-3)}

/* ---------- about ---------- */
.about .copy.about-copy{max-width:420px}
.flow{list-style:none;margin:0;padding:72px 8px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px 36px}
.flow-step{display:flex;flex-direction:column}
.flow-step .frame{box-shadow:0 14px 36px rgba(0,0,0,.6)}
.flow-art{position:relative;z-index:1;display:block;aspect-ratio:2/3;background:#EFE8D8;overflow:hidden;
  box-shadow:0 0 0 1px rgba(61,43,30,.18)}
.flow-art img{width:100%;height:100%;object-fit:cover}
.flow-art svg{display:block;width:100%;height:100%}
.flow-n{font-family:var(--stars);font-size:clamp(22px,2.4vw,32px);letter-spacing:.2em;line-height:1.3;margin-top:26px}
.flow-t{font-family:var(--kr);font-weight:400;font-size:clamp(19px,1.7vw,22px);letter-spacing:-.03em;line-height:1.35;margin-top:8px}
.flow-d{font-family:var(--kr);font-size:15px;line-height:1.8;color:var(--mint);margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding:8px 0 0}
.facts strong{display:block;font-family:var(--stars);font-weight:400;font-size:clamp(44px,6.6vw,94px);letter-spacing:-.065em;line-height:1.06;white-space:nowrap}
.facts span{display:block;font-family:var(--kr);font-size:15px;line-height:1.8;color:var(--text-2);margin-top:12px}
.about .about-lede{color:var(--text-2);font-size:clamp(16px,1.5vw,20px);line-height:2;max-width:760px}
.about-cta{display:inline-block;margin-top:36px;font-family:var(--kr);font-size:clamp(16px,1.5vw,20px);
  border-bottom:1px solid var(--text);padding-bottom:4px;transition:color 180ms,border-color 180ms}
.about-cta:hover{color:var(--mint);border-color:var(--mint)}

@media(min-width:768px) and (max-width:1199px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  main,footer{padding-left:56px;padding-right:56px}
  header{padding-left:56px;padding-right:56px}
}
@media(max-width:767px){
  header{padding:32px 24px 0}
  main{padding:0 24px 32px}
  footer{padding:24px 24px 40px}
  .grid{grid-template-columns:minmax(0,1fr);gap:36px;padding-top:44px}
  .card{transform:none}
  .frame{transform:none;padding:6.5%}
  .count{text-align:left;margin-top:20px}
  .product{grid-template-columns:1fr;gap:28px}
  .divider{margin-top:64px}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 18px;padding:44px 0 0}
  .flow-step .frame{transform:none;padding:6.5%}
  .flow-n{margin-top:18px}
  .flow-d{font-size:14px}
  .facts{grid-template-columns:minmax(0,1fr);gap:28px}
  .wear-list{gap:14px;margin-top:28px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .card,.frame,.card:hover .frame,.card:focus-visible .frame{transform:none!important}
}
</style>

    <a class="wordmark" href="#/" aria-label="OUTSIDOOR 홈">OUTSIDOOR</a>
    <a class="nav-link" href="#/about">About us&nbsp;&nbsp;↗</a>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer>
    <span>© 2026 OUTSIDOOR</span>
    <span class="kr">문 안의 그림, 문 밖의 만남.</span>
  </footer>
</div>
